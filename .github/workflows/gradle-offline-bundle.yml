name: Gradle JDK21 Offline Release (N11o ZIP)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Prepare image and export TAR parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          IMAGE='gradle:9.8.0-jdk21-noble'
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" gradle --version
          docker save "$IMAGE" | split -b 300M -d -a 3 - output/gradle-jdk21.tar.part-

      - name: Create manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > output/versions.env <<'VERSIONS'
          SOURCE_IMAGE=gradle:9.8.0-jdk21-noble
          TARGET_IMAGE=repo-sec.nexus.local:31920/devsecops/gradle:9.8.0-jdk21
          ARCH=linux/amd64
          GRADLE_VERSION=9.8.0
          JAVA_VERSION=21
          VERSIONS
          (cd output && sha256sum gradle-jdk21.tar.part-* versions.env > SHA256SUMS)
          ls -lh output

      - name: Publish individual files as release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: offline-gradle-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "Gradle JDK21 offline bundle $RELEASE_TAG" \
            --notes 'Separate TAR parts; no ZIP artifact. Verify SHA256SUMS before loading.' \
            --latest=false
          gh release upload "$RELEASE_TAG" output/*
          gh release view "$RELEASE_TAG" --json url --jq '.url'
